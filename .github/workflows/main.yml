name: Auto CCTV Edge Analysis

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 내 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 2. 파이썬 환경 세팅 (Python 3.12)
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 3. CI/CD 전용 경량 비전 라이브러리 설치
      run: pip install opencv-python-headless numpy requests

    - name: 4. Local Edge Vision 분석 실행
      run: python analyze.py

    - name: 5. 갱신된 JSON 파일 저장
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data.json || true
        git commit -m "데이터 자동 갱신: 한강공원 Edge 상태 분석" || echo "No changes to commit"
        git push
