name: Auto CCTV Analysis

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 내 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 2. 파이썬 환경 세팅 (Python 3.12)
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 3. 최신 SDK 및 라이브러리 설치
      run: pip install google-genai requests pillow

    - name: 4. AI 비전 분석 스크립트 실행
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python analyze.py

    - name: 5. 갱신된 JSON 파일을 깃허브에 저장
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data.json || true
        git commit -m "데이터 자동 갱신: 한강공원 상태" || echo "No changes to commit"
        git push
