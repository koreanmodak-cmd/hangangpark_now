name: Auto CCTV Analysis

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# 봇에게 저장소 쓰기 권한 부여 (Exit code 128 방지)
permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 내 저장소 코드 가져오기
      uses: actions/checkout@v4  # v3 -> v4 로 최신화

    - name: 2. 파이썬 환경 세팅
      uses: actions/setup-python@v5  # v4 -> v5 로 최신화
      with:
        python-version: '3.11'

    - name: 3. 필요한 라이브러리 설치
      run: pip install google-generativeai requests pillow

    - name: 4. AI 비전 분석 스크립트 실행
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python analyze.py

    - name: 5. 갱신된 JSON 파일을 깃허브에 저장
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data.json || true
        git commit -m "데이터 자동 갱신: 한강공원 상태" || echo "No changes to commit"
        git push
